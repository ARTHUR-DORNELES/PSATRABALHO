<!-- Contador de inscritos: começa em 27 e soma +19 a cada dia. Ajuste START_DATE se quiser outra base. -->
<script>
  document.addEventListener('DOMContentLoaded', function(){
    var el = document.getElementById('participant-count');
    if (!el) return;
    var START_DATE = new Date('2026-05-13T00:00:00-03:00'); // dia 0 = 27 inscritos
    var BASE = 27, PER_DAY = 19;
    var days = Math.max(0, Math.floor((new Date() - START_DATE) / 86400000));
    el.textContent = (BASE + days * PER_DAY).toLocaleString('pt-BR');
  });
</script>
