function startAudio(){if(AC){AC.resume&&AC.resume();return;}try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}master=AC.createGain();master.gain.value=muted?0:0.12;master.connect(AC.destination);padF=AC.createBiquadFilter();padF.type='lowpass';padF.frequency.value=900;padF.connect(master);var pg=AC.createGain();pg.gain.value=0.045;pg.connect(padF);_pA=AC.createOscillator();_pB=AC.createOscillator();_pA.type='sine';_pB.type='sine';_pA.connect(pg);_pB.connect(pg);_pA.start();_pB.start();applyMood();schedOn=true;sched();}
