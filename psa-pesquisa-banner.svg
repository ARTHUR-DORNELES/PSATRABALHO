<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" font-family="'Arial Black', 'Inter', system-ui, sans-serif">
  <!-- Fundo laranja PSA -->
  <rect width="1200" height="200" fill="#FF5E1A"/>

  <!-- ============ LADO ESQUERDO: PSA.PESQUISA ============ -->
  <g fill="#1A2BD8" transform="translate(48, 132)">
    <text font-size="86" font-weight="900" letter-spacing="-3">
      <tspan>PSA</tspan><tspan dx="-2">.</tspan><tspan dx="-2">PESQUISA</tspan>
    </text>
  </g>

  <!-- ============ LADO DIREITO: ELEMENTOS DECORATIVOS ============ -->
  <g fill="#1A2BD8">

    <!-- Estampa "ESPETÁCULO DO CONHECIMENTO" (rotacionada levemente) -->
    <g transform="translate(720, 50) rotate(-6)">
      <rect x="0" y="0" width="240" height="44" fill="none" stroke="#1A2BD8" stroke-width="3.5"/>
      <text x="120" y="30" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="1">ESPETÁCULO DO</text>
    </g>

    <!-- Estampa "CONHECIMENTO" (rotacionada) -->
    <g transform="translate(740, 100) rotate(-6)">
      <rect x="0" y="0" width="180" height="42" fill="none" stroke="#1A2BD8" stroke-width="3.5"/>
      <text x="90" y="30" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="2">CONHECIMENTO</text>
    </g>

    <!-- Estampa "O MAIOR SHOW DA TERRA" (rotacionada para a direita) -->
    <g transform="translate(990, 60) rotate(8)">
      <rect x="0" y="0" width="180" height="38" fill="none" stroke="#1A2BD8" stroke-width="3.5"/>
      <text x="90" y="26" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="1.2">O MAIOR SHOW</text>
    </g>
    <g transform="translate(1010, 105) rotate(8)">
      <rect x="0" y="0" width="140" height="38" fill="none" stroke="#1A2BD8" stroke-width="3.5"/>
      <text x="70" y="26" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="1.2">DA TERRA</text>
    </g>

    <!-- Estrelas espalhadas -->
    <!-- Estrela 1 -->
    <polygon points="690,30 695,46 712,46 698,56 703,72 690,62 677,72 682,56 668,46 685,46" />
    <!-- Estrela 2 -->
    <polygon points="970,28 974,40 986,40 976,48 980,60 970,52 960,60 964,48 954,40 966,40" />
    <!-- Estrela 3 -->
    <polygon points="1160,38 1164,50 1176,50 1166,58 1170,70 1160,62 1150,70 1154,58 1144,50 1156,50" />
    <!-- Estrela 4 (menor, dentro do espaço) -->
    <polygon points="940,150 943,160 953,160 945,166 948,176 940,170 932,176 935,166 927,160 937,160" />
    <!-- Estrela 5 -->
    <polygon points="1170,160 1173,170 1183,170 1175,176 1178,186 1170,180 1162,186 1165,176 1157,170 1167,170" />

    <!-- Triângulos -->
    <polygon points="710,160 730,160 720,178" />
    <polygon points="780,170 800,170 790,188" />
    <polygon points="1090,30 1110,30 1100,48" />

    <!-- Carinhas/círculos pequenos -->
    <!-- Smiley 1 -->
    <g transform="translate(820, 150)">
      <circle cx="0" cy="0" r="12" fill="none" stroke="#1A2BD8" stroke-width="3"/>
      <circle cx="-4" cy="-2" r="1.6" fill="#1A2BD8"/>
      <circle cx="4" cy="-2" r="1.6" fill="#1A2BD8"/>
      <path d="M -5 3 Q 0 7 5 3" fill="none" stroke="#1A2BD8" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- Smiley 2 -->
    <g transform="translate(870, 165)">
      <circle cx="0" cy="0" r="11" fill="none" stroke="#1A2BD8" stroke-width="3"/>
      <circle cx="-3.5" cy="-2" r="1.4" fill="#1A2BD8"/>
      <circle cx="3.5" cy="-2" r="1.4" fill="#1A2BD8"/>
      <path d="M -4 3 Q 0 6 4 3" fill="none" stroke="#1A2BD8" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- Interrogação dentro de círculo -->
    <g transform="translate(1050, 165)">
      <circle cx="0" cy="0" r="13" fill="none" stroke="#1A2BD8" stroke-width="3"/>
      <text x="0" y="5" font-size="18" font-weight="900" text-anchor="middle" fill="#1A2BD8">?</text>
    </g>

  </g>
</svg>
